<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rojak Sentiment</title>
    <meta name="description" content="Read the mood of Malay, English and code-switched comments. The model runs in your browser, so your text stays on your device." />
    <meta name="theme-color" content="#F4F1FB" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem('rojak-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
