name: Publish browser model
# Uploads the evaluated ONNX files to Hugging Face. Runs when the evaluation record changes
# on the browser-model branch. Every file is checked against the SHA-256 recorded at evaluation,
# so only the exact files that were scored can be published.
on:
  push:
    branches: [browser-model]
    paths: [verification/browser_model_evaluation.json]
permissions:
  contents: write
  actions: read
env:
  HF_REPO: SiobhanGoh/malay-english-sentiment-onnx
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the evaluated export run
        id: release
        run: echo "run_id=$(python -c "import json;print(json.load(open('verification/browser_model_evaluation.json'))['export_run_id'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: browser-model
          path: browser-model
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install huggingface_hub==0.36.2
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::Add a Hugging Face write token as the HF_TOKEN repository secret."; exit 1; fi
          python training/publish_browser.py --model browser-model --repo "$HF_REPO" \
            --evaluation verification/browser_model_evaluation.json --out verification/browser_model_release.json
      - name: Record the pinned revision
        run: |
          git config user.name "SiobhanGoh"
          git config user.email "siobhangoh17@gmail.com"
          git add verification/browser_model_release.json
          git commit -m "Record published browser model revision"
          git push
