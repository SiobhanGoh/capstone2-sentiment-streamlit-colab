name: Browser model export
# Converts the pinned checkpoint to ONNX for the web app. Runs when this file or the
# export script changes on the browser-model branch, or by hand from the Actions tab.
on:
  push:
    branches: [browser-model]
    paths: [training/export_browser.py, .github/workflows/browser-model.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same library versions as the deployed app and training environment.
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
      - run: python -m pip install transformers==4.57.6 huggingface_hub==0.36.2 safetensors==0.8.0 numpy==2.3.5 pandas==3.0.1 scikit-learn==1.7.2 onnx onnxruntime onnxconverter-common
      - run: python training/export_browser.py --out browser-model
      - uses: actions/upload-artifact@v4
        with:
          name: browser-model
          path: browser-model
          retention-days: 7
          compression-level: 0

  # Temporary hand-off for offline evaluation: the files are split below GitHub's 100 MB
  # file limit and pushed to a short-lived branch, which is deleted after checksums are verified.
  transfer:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-model
          path: browser-model
      - name: Push split files to the model-transfer branch
        run: |
          cd browser-model
          for f in $(find . -name '*.onnx'); do split -b 95m -d -a 2 "$f" "$f.part"; rm "$f"; done
          git init -q -b model-transfer
          git config user.name "SiobhanGoh"
          git config user.email "siobhangoh17@gmail.com"
          git add -A
          git commit -q -m "Temporary browser model transfer (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" model-transfer
