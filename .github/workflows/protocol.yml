name: Sentiment data protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas==3.0.1 numpy==2.3.5 scikit-learn==1.7.2 joblib==1.6.0 streamlit==1.66.1 matplotlib==3.10.7 reportlab==4.4.9 requests==2.34.2 pypdf pytest
      - run: python -m pytest -q tests
