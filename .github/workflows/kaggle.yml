name: Kaggle training
# Launches a training experiment on Kaggle's free GPU, or collects a finished one.
# Needs repository secrets KAGGLE_USERNAME and KAGGLE_API_TOKEN (or legacy KAGGLE_KEY), and the
# corpus uploaded on Kaggle as the private dataset <username>/rojak-sentiment-private.
# Collect pushes only numbers (metrics and logits) to the kaggle-results branch: no corpus text,
# no extra tweets and no model weights; the kept models stay in the private Kaggle output.
# Run it by hand from the Actions tab (once on the default branch), or by pushing a change to
# training/kaggle_request.json on the browser-model branch, e.g. {"action": "launch", "experiment": "smoke"}.
on:
  push:
    branches: [browser-model]
    paths: [training/kaggle_request.json]
  workflow_dispatch:
    inputs:
      action:
        description: launch, status, collect, publish or cleanup
        required: true
        default: status
        type: choice
        options: [launch, status, collect, publish, cleanup]
      experiment:
        description: Experiment in training/kaggle_job.py
        required: true
        default: smoke
        type: choice
        options: [smoke, large, large2, silver, distill, export, llm, llm-smoke, oof, clean, abstain]
permissions:
  contents: write
concurrency:
  group: kaggle
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Request
        id: req
        env:
          ACTION: ${{ inputs.action }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          if [ -z "$ACTION" ]; then
            ACTION=$(jq -r .action training/kaggle_request.json); EXPERIMENT=$(jq -r .experiment training/kaggle_request.json)
          fi
          case "$ACTION" in launch|status|collect|publish|cleanup) ;; *) echo "::error::Unknown action $ACTION"; exit 1;; esac
          case "$EXPERIMENT" in smoke|large|large2|silver|distill|export|llm|llm-smoke|oof|clean|abstain) ;; *) echo "::error::Unknown experiment $EXPERIMENT"; exit 1;; esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"; echo "experiment=$EXPERIMENT" >> "$GITHUB_OUTPUT"
          echo "KERNEL=$KAGGLE_USERNAME/rojak-sentiment-$EXPERIMENT" >> "$GITHUB_ENV"
          echo "### $ACTION $EXPERIMENT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kaggle credentials
        env:
          TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          test -n "$KAGGLE_USERNAME" || { echo "::error::Add the KAGGLE_USERNAME repository secret."; exit 1; }
          if [ -n "$TOKEN" ]; then echo "KAGGLE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV";
          elif [ -n "$KEY" ]; then echo "KAGGLE_KEY=$KEY" >> "$GITHUB_ENV";
          else echo "::error::Add the KAGGLE_API_TOKEN (or legacy KAGGLE_KEY) repository secret."; exit 1; fi
          python -m pip install -q --upgrade kaggle six numpy pandas scikit-learn
          kaggle --version
      - name: Launch
        if: steps.req.outputs.action == 'launch'
        run: |
          mkdir kernel
          python training/kaggle_entry.py "${{ steps.req.outputs.experiment }}" "$GITHUB_SHA" kernel/kaggle_entry.py
          # Distillation reads the teacher's logits from the earlier runs' outputs.
          sources='[]'
          if [ "${{ steps.req.outputs.experiment }}" = export ]; then
            sources="[\"$KAGGLE_USERNAME/rojak-sentiment-distill\"]"
          fi
          # 'abstain' only reads the export run's ONNX logits and runs on CPU, so it uses no GPU quota.
          gpu=true
          if [ "${{ steps.req.outputs.experiment }}" = abstain ]; then
            sources="[\"$KAGGLE_USERNAME/rojak-sentiment-export\"]"; gpu=false
          fi
          if [ "${{ steps.req.outputs.experiment }}" = distill ]; then
            sources="[\"$KAGGLE_USERNAME/rojak-sentiment-large\", \"$KAGGLE_USERNAME/rojak-sentiment-large2\", \"$KAGGLE_USERNAME/rojak-sentiment-silver\", \"$KAGGLE_USERNAME/rojak-sentiment-llm\"]"
          fi
          cat > kernel/kernel-metadata.json <<EOF
          {"id": "$KERNEL", "title": "rojak-sentiment-${{ steps.req.outputs.experiment }}", "code_file": "kaggle_entry.py",
           "language": "python", "kernel_type": "script", "is_private": true, "enable_gpu": $gpu,
           "enable_internet": true, "dataset_sources": ["$KAGGLE_USERNAME/rojak-sentiment-private"],
           "competition_sources": [], "kernel_sources": $sources, "model_sources": []}
          EOF
          # Ask for a T4: recent PyTorch builds may not support the older P100 default.
          if [ "$gpu" = true ]; then
            kaggle kernels push -p kernel --accelerator NvidiaTeslaT4 || kaggle kernels push -p kernel
          else
            kaggle kernels push -p kernel
          fi
      - name: Status
        id: status
        if: steps.req.outputs.action != 'launch'
        run: |
          s=$(kaggle kernels status "$KERNEL" 2>&1) || true
          echo "$s"
          state=$(echo "$s" | grep -oiE 'complete|error|running|queued|cancel[a-z]*' | head -1 | tr 'A-Z' 'a-z')
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "### Kaggle $KERNEL: ${state:-unknown}" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect numbers
        if: steps.req.outputs.action == 'collect' && (steps.status.outputs.state == 'complete' || steps.status.outputs.state == 'error')
        run: |
          mkdir -p fetched
          kaggle kernels output "$KERNEL" -p fetched --force || true
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" kaggle-results >/dev/null; then
            git clone -q --depth 1 -b kaggle-results "$url" publish
          else
            git init -q -b kaggle-results publish && git -C publish remote add origin "$url"
          fi
          dest="results/${{ steps.req.outputs.experiment }}"
          rm -rf "publish/$dest" && mkdir -p "publish/$dest"
          # The run summary (numbers only) also goes in the job log, readable even if the push below fails.
          [ -f fetched/out/summary.json ] && cat fetched/out/summary.json
          cd fetched
          # Numbers only: JSON records and logits arrays. Weights and any text files are left out.
          find . \( -name '*.json' -o -name 'logits.npz' \) -not -path './out/models/*' | while read f; do
            mkdir -p "../publish/$dest/$(dirname "$f")"; cp "$f" "../publish/$dest/$f"; done
          # The run log, for diagnosing failures; it contains progress lines, never corpus text.
          for f in *.log; do [ -f "$f" ] && tail -n 300 "$f" > "../publish/$dest/run.log.txt"; done
          cd ../publish
          git config user.name "SiobhanGoh"
          git config user.email "siobhangoh17@gmail.com"
          git add -A
          git commit -q -m "Kaggle ${{ steps.req.outputs.experiment }} results (${{ steps.status.outputs.state }}, code ${GITHUB_SHA::7})" || echo "nothing new"
          for i in 1 2 3 4 5; do git push -q origin kaggle-results && break; echo "push failed, retrying in $((i*20))s"; sleep $((i*20)); done
          echo "Pushed results/${{ steps.req.outputs.experiment }} to kaggle-results" >> "$GITHUB_STEP_SUMMARY"
      # Publish the checked distilled student (approved by the owner on 4 Nov 2026). Only for 'export'.
      - name: Publish student to Hugging Face
        if: steps.req.outputs.action == 'publish' && steps.req.outputs.experiment == 'export' && steps.status.outputs.state == 'complete'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Add the HF_TOKEN repository secret."; exit 1; }
          python -m pip install -q huggingface_hub==0.36.2
          mkdir -p fetched staging
          kaggle kernels output "$KERNEL" -p fetched --force
          python training/publish_student.py --model fetched/out/models/browser-model --repo SiobhanGoh/malay-english-sentiment-onnx \
            --evaluation verification/student_onnx_evaluation.json --staging staging --out verification/student_model_release.json
          # Temporary hand-off for the in-browser check: split below GitHub's 100 MB limit; deleted after the check.
          mkdir transfer && cp -r staging/. transfer/ && cd transfer
          for f in $(find . -name '*.onnx'); do split -b 95m -d -a 2 "$f" "$f.part"; rm "$f"; done
          git init -q -b model-transfer && git config user.name "SiobhanGoh" && git config user.email "siobhangoh17@gmail.com"
          git add -A && git commit -q -m "Temporary student model transfer (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" model-transfer
          cd ..
          git config user.name "SiobhanGoh" && git config user.email "siobhangoh17@gmail.com"
          git add verification/student_model_release.json
          git commit -q -m "Record the published distilled student revision"
          git pull -q --rebase origin browser-model && git push -q origin HEAD:browser-model
          cat verification/student_model_release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the temporary transfer branch
        if: steps.req.outputs.action == 'cleanup'
        run: git push origin --delete model-transfer || echo "No transfer branch to delete."
